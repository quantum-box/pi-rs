apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: pi-rs
  tenantId: tn_01kxz0ytmhnab5vh53011cwctj
spec:
  apps:
    - name: pi-rs-browser-preview
      repository:
        url: https://github.com/quantum-box/pi-rs
        owner: quantum-box
        name: pi-rs
        defaultBranch: main
      rootDirectory: ""
      framework: static
      deploymentTarget: cloudflare_pages
      build:
        installCommand: "true"
        command: bash examples/browser-preview/build.sh
        outputDirectory: examples/browser-preview/dist
        nodeVersion: "22"
      watchPaths:
        - examples/browser-preview/**
        - tachyon.yml
      envVars: []
