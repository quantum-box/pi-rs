[package]
name = "pi-rs-tauri-sdk-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]

[dependencies]
pi-rs-core = { path = "../../crates/core" }
tauri = { version = "=2.11.5", default-features = false }
