[package]
name = "reqwest-http3-security-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
reqwest12 = { package = "reqwest", path = "../../vendor/reqwest-0.12.28", features = ["http3"] }
reqwest13 = { package = "reqwest", path = "../../vendor/reqwest-0.13.5", features = ["http3"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
