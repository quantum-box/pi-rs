name: Vendored reqwest advisory monitoring

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify upstream archive and patches
        run: python3 vendor/verify-reqwest.py
      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --version 0.23.0 --locked
      - name: Audit vendored registry versions
        run: cargo +stable audit --file vendor/reqwest-audit.lock
      - name: Verify known advisory detection
        run: |
          if cargo +stable audit --file vendor/audit-smoke.lock > "$RUNNER_TEMP/audit-smoke.log" 2>&1; then
            echo "Expected known vulnerable fixture to fail"
            exit 1
          fi
          cat "$RUNNER_TEMP/audit-smoke.log"
          grep -q RUSTSEC-2020-0071 "$RUNNER_TEMP/audit-smoke.log"
