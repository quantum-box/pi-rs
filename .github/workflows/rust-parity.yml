name: Focused share main port
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89.0 --profile minimal --component clippy
      - run: cargo +1.89.0 clippy --locked -p pi-rs-workbench --all-features --all-targets -- -D warnings
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs share_readiness_wait_is_bounded_and_reports_closed_worker
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs cancelled_mint_caller_still_persists_new_key
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs cancelled_caller_still_saves_rotated_refresh_token
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs refresh_persists_rotation_before_minimum_error_and_survives_cancellation
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs cancelled_refresh_survives_runtime_shutdown_and_persists_rotation
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs rotating_refresh_holds_shared_store_lock_until_persisted
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --lib cancelled_runtime_persists_rotated_mcp_refresh_token
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs standalone_share_
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs backend::share_context_tests
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --lib private_share_store
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --test share_presentation -- --test-threads=1
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --test cli rpc_worker_starts_when_ -- --test-threads=1
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --test cli worker_returns_keyed_share_journal_tag -- --test-threads=1
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --test cli standalone_radius_share_reconstructs_instead_of_using_old_cache -- --test-threads=1
