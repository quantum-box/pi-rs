name: Rust parity
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native acceptance platform
        type: choice
        default: windows-latest
        options: [windows-latest]
permissions:
  contents: read
jobs:
  windows-dpapi:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 test --locked --manifest-path tools/share-dpapi-ci/Cargo.toml
