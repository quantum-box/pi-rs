name: XAI rotation diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89.0 --profile minimal
      - name: Run acceptance tests with refresh stage diagnostics
        run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs diagnostic_unread_request_after_cancel -- --nocapture
      - name: Repeat cancellation fixture
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 30; $i++) {
            cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs diagnostic_unread_request_after_cancel -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
