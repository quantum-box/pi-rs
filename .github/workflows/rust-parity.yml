name: Focused share main port
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89.0 --profile minimal --component clippy
      - run: cargo +1.89.0 test --locked -p pi-rs-workbench --test cli worker_returns_keyed_share_journal_tag -- --test-threads=1
