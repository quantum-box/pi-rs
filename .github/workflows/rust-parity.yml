name: Focused share context validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89.0 --profile minimal
      - name: Test OAuth refresh and private storage
        run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs refresh
      - name: Test private storage
        run: cargo +1.89.0 test --locked -p pi-rs-workbench --lib private_share_store
      - name: Test live share capture
        run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs backend::share_context_tests
      - name: Test Radius cached context export
        run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs radius_upload_uses_reopened_journal_bound_cached_context
      - name: Test unavailable cache RPC startup
        run: cargo +1.89.0 test --locked -p pi-rs-workbench --test cli rpc_worker_starts_when_
      - name: Test live journal integrity
        run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs live_share_rejects_different_journal
      - name: Test pending share correlation
        run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs pending_share_keeps_extension_dialog_and_response_correlated
      - name: Test live worker journal tag
        run: cargo +1.89.0 test --locked -p pi-rs-workbench --test cli worker_returns_keyed_share_journal_tag
      - name: Test missing live context rejection
        run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs radius_share_rejects_
      - name: Test live journal key correlation
        run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs live_share_response_keeps_its_private_journal_key
      - name: Test live share private fields
        run: cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs radius_share_uploads_context_for_matching_snapshot
