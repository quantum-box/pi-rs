name: XAI refresh diagnosis

on:
  push:
    branches: [codex/xai-refresh-diagnosis]

permissions:
  contents: read

jobs:
  windows-refresh:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: 1
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cmd-format: rustup run 1.89.0 {0}
      - name: Repeat cancellation refresh test
        shell: pwsh
        run: |
          for ($iteration = 1; $iteration -le 20; $iteration++) {
            Write-Host "Cancellation refresh run $iteration"
            cargo +1.89.0 test --locked -p pi-rs-workbench --bin pi-rs xai_auth::tests::cancelled_caller_still_saves_rotated_refresh_token -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
