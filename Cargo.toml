[workspace]
members = ["crates/workbench"]
resolver = "3"

[package]
name = "pi-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Embeddable agent harness with recoverable sessions and Rust extensions"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
eventsource-stream = "0.2"
futures-util = "0.3"
jsonschema = { version = "0.33", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "process", "signal", "sync", "time", "fs", "io-util", "io-std"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
