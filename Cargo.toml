[workspace]
members = ["crates/fixture-tools", "crates/aip-host", "crates/core", "crates/ollama", "crates/plan-mode", "crates/review", "crates/extensions", "crates/workbench"]
resolver = "3"

[package]
name = "pi-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Embeddable agent harness with recoverable sessions and Rust extensions"

[features]
default = ["ollama"]
ollama = ["dep:pi-rs-ollama"]

[dependencies]
pi-rs-core = { path = "crates/core", version = "0.1.0" }
pi-rs-ollama = { path = "crates/ollama", version = "0.1.0", optional = true }

[dev-dependencies]
async-trait = "0.1"
futures-util = "0.3"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = "1"
pi-rs-review = { path = "crates/review" }
