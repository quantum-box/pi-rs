[workspace]
members = ["crates/bedrock", "crates/anthropic", "crates/fixture-tools", "crates/aip-host", "crates/core", "crates/google", "crates/ollama", "crates/openai", "crates/plan-mode", "crates/review", "crates/remote-find", "crates/remote-grep", "crates/remote-ls", "crates/extensions", "crates/workbench"]
resolver = "3"

[package]
name = "pi-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Embeddable agent harness with recoverable sessions and Rust extensions"

[features]
default = ["ollama"]
ollama = ["dep:pi-rs-ollama"]
bedrock = ["dep:pi-rs-bedrock"]
anthropic = ["dep:pi-rs-anthropic"]
google = ["dep:pi-rs-google"]
openai = ["dep:pi-rs-openai"]

[[example]]
name = "native_sdk_host"
required-features = ["ollama"]

[dependencies]
pi-rs-bedrock = { path = "crates/bedrock", version = "0.1.0", optional = true }
pi-rs-core = { path = "crates/core", version = "0.1.0" }
pi-rs-anthropic = { path = "crates/anthropic", version = "0.1.0", optional = true }
pi-rs-google = { path = "crates/google", version = "0.1.0", optional = true }
pi-rs-ollama = { path = "crates/ollama", version = "0.1.0", optional = true }
pi-rs-openai = { path = "crates/openai", version = "0.1.0", optional = true }

[dev-dependencies]
async-trait = "0.1"
futures-util = "0.3"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = "1"
pi-rs-review = { path = "crates/review" }
