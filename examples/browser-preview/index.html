<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>pi-rs ブラウザ SDK プレビュー</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f6f9; color: #182335; }
    body { margin: 0; }
    main { max-width: 800px; margin: 6vh auto; padding: 28px; }
    h1 { font-size: 27px; margin: 8px 0; }
    .hint { color: #536275; line-height: 1.6; }
    .badge { display: inline-block; background: #dff5e9; color: #16613b; padding: 5px 10px; border-radius: 20px; font-size: 13px; }
    .box { background: white; border: 1px solid #e1e6ee; border-radius: 14px; padding: 22px; margin-top: 20px; box-shadow: 0 5px 24px #1c2b3b0b; }
    #log { min-height: 120px; max-height: 45vh; overflow: auto; white-space: pre-wrap; line-height: 1.8; }
    .user { color: #075aa2; } .assistant { color: #26714b; } .status { color: #536275; font-size: 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    input { flex: 1; min-width: 200px; padding: 12px; border: 1px solid #b9c4d2; border-radius: 8px; font: inherit; }
    button { padding: 10px 14px; border: 1px solid #b9c4d2; border-radius: 8px; background: white; cursor: pointer; font: inherit; }
    button.primary { background: #1d5dc9; color: white; border-color: #1d5dc9; }
    button:disabled { opacity: .45; }
  </style>
</head>
<body>
<main>
  <span class="badge">ブラウザで動作する Rust / WASM</span>
  <h1>pi-rs セッションプレビュー</h1>
  <p class="hint">pi-rs の AgentSession がこのブラウザ内で動作します。回答はプレビュー用の<b>模擬応答</b>で、実際の AI モデルには接続しません。</p>
  <div class="box">
    <div id="log" aria-live="polite"></div>
    <p id="status" class="status">WASM を読み込み中…</p>
    <div class="row">
      <input id="input" value="こんにちは！" aria-label="メッセージ">
      <button id="send" class="primary" disabled>送信</button>
      <button id="cancel" disabled>キャンセル</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="reopen" disabled>保存した会話を再オープン</button>
      <button id="slow" disabled>待機する通信を開始</button>
    </div>
    <p class="hint">会話はこのブラウザに保存されます。「待機する通信を開始」のあとに「キャンセル」を押すと中断を試せます。</p>
  </div>
</main>
<script type="module">
import init, { BrowserSession } from './pkg/pi_rs_browser_sdk.js';

// Demo gateway: the SDK issues a POST, and this adapter fetches a static mock
// response. It never sends the user's text to a model provider.
const nativeFetch = window.fetch.bind(window);
window.fetch = async function(request, options) {
  if (request instanceof Request && new URL(request.url).pathname === '/demo-gateway') {
    const body = await request.clone().json();
    const last = body.messages.filter(m => m.role === 'user').at(-1)?.content;
    const delay = last === 'キャンセルを試す' ? 10000 : 400;
    await new Promise((resolve, reject) => {
      if (request.signal.aborted) { reject(new DOMException('Aborted', 'AbortError')); return; }
      const timer = setTimeout(resolve, delay);
      request.signal.addEventListener('abort', () => { clearTimeout(timer); reject(new DOMException('Aborted', 'AbortError')); }, { once: true });
    });
    return nativeFetch('./mock-response.json', { signal: request.signal, cache: 'no-store' });
  }
  return nativeFetch(request, options);
};
const log = document.querySelector('#log'), status = document.querySelector('#status');
const send = document.querySelector('#send'), cancel = document.querySelector('#cancel');
const reopen = document.querySelector('#reopen'), slow = document.querySelector('#slow'), input = document.querySelector('#input');
let session;
function show(text, cls = 'status') { const item = document.createElement('div'); item.className = cls; item.textContent = text; log.append(item); log.scrollTop = log.scrollHeight; }
function render() {
  log.replaceChildren();
  const messages = JSON.parse(session.messages());
  for (const message of messages) {
    if (message.role === 'user') show('あなた: ' + message.content, 'user');
    if (message.role === 'assistant' && message.content) show('pi-rs: ' + message.content, 'assistant');
  }
  if (!messages.length) show('まだ会話はありません。メッセージを送ってください。');
}
function ready() { send.disabled = false; reopen.disabled = false; slow.disabled = false; cancel.disabled = true; }
async function run(text) {
  send.disabled = reopen.disabled = slow.disabled = true; cancel.disabled = false; status.textContent = '通信中…';
  try { await session.prompt(text); render(); status.textContent = '完了（会話をブラウザに保存しました）'; }
  catch (error) { render(); status.textContent = '中断またはエラー: ' + String(error); }
  finally { ready(); }
}
send.onclick = () => run(input.value);
input.onkeydown = event => { if (event.key === 'Enter' && !send.disabled) send.click(); };
slow.onclick = () => run('キャンセルを試す');
cancel.onclick = () => { session.cancel(); status.textContent = 'キャンセルを要求しました…'; };
reopen.onclick = async () => {
  send.disabled = reopen.disabled = slow.disabled = true;
  try { await session.close(); session.free(); session = await BrowserSession.open('tachyon-preview', location.origin + '/demo-gateway', 'preview', '', 15000); render(); status.textContent = '保存した会話を復元しました'; ready(); }
  catch (error) { status.textContent = '復元できません: ' + String(error); }
};
try { await init(); session = await BrowserSession.open('tachyon-preview', location.origin + '/demo-gateway', 'preview', '', 15000); render(); status.textContent = '準備完了'; ready(); }
catch (error) { status.textContent = '起動できません: ' + String(error); }
</script>
</body>
</html>
