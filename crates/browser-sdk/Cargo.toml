[package]
name = "pi-rs-browser-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pi-rs-core = { path = "../core" }
pi-rs-browser-fetch = { path = "../browser-fetch" }
async-trait = "0.1"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["Window", "Storage"] }
