[package]
name = "pi-rs-durable-openai"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Opt-in OpenAI Responses adapter for pi-rs durable"

[workspace]

[dependencies]
pi-rs-durable = { path = "../durable", features = ["openai-responses"] }

[dev-dependencies]
async-trait = "0.1"
pi-rs-core = { path = "../core" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
