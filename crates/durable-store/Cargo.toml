[package]
name = "durable-store"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
experimental-graph-scope = []
experimental-graph-revision = []

[dependencies]
flate2 = "1"
durable-task-schema = { path = "../durable-task-schema" }
uuid = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
libc = "0.2"

[[bin]]
name = "durable-graph-rehearsal"
path = "src/bin/durable_graph_rehearsal.rs"
required-features = ["experimental-graph-revision"]
