[package]
name = "pi-rs-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Provider-neutral agent execution and session contracts"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
jsonschema = { version = "0.33", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
cap-std = "4"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
