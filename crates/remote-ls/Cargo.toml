[workspace]

[package]
name = "pi-rs-remote-ls"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1"
icu_collator = "2.4"
icu_locale_core = "2.4"
pi-rs = { path = "../..", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
url = "2"

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = "1"
