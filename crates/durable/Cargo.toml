[package]
name = "pi-rs-durable"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Experimental durable agent runtime for pi-rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
pi-rs-core = { path = "../core" }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
durable-store = { path = "../durable-store" }
thiserror = "2"
jsonschema = { version = "0.33", default-features = false }
async-trait = "0.1"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

