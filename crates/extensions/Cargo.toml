[package]
name = "pi-rs-extensions"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Standard native Rust extensions for the pi-rs agent harness"

[dependencies]
async-trait = "0.1"
pi-rs-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "process", "io-util", "time"] }
libc = "0.2"
