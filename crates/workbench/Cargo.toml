[package]
name = "pi-rs-workbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
default-run = "pi-rs"

[[bin]]
name = "pi-rs"
path = "src/main.rs"

[[bin]]
name = "pi"
path = "src/pi.rs"

[features]
evaluation-fixtures = ["dep:pi-rs-fixture-tools"]

[dependencies]
arboard = { version = "3.7", features = ["wayland-data-control"] }
async-trait = "0.1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
globset = "0.4"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
ignore = "0.4"
libc = "0.2"
jsonschema = { version = "0.33", default-features = false }
palette = "0.7"
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
shell-words = "1"
similar = "2.7"
pi-rs = { path = "../.." }
pi-rs-extensions = { path = "../extensions" }
pi-rs-fixture-tools = { path = "../fixture-tools", optional = true }
pi-rs-plan-mode = { path = "../plan-mode" }
pi-rs-review = { path = "../review" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
process-wrap = { version = "10", features = ["tokio1"] }
rmcp = { version = "3.9", default-features = false, features = ["client", "auth", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest-mcp = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
tokio = { version = "1", features = ["macros", "rt", "process", "signal", "sync", "time", "fs", "io-util", "io-std", "net"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
